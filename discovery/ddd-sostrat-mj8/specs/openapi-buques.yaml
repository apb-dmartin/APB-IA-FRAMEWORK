openapi: 3.0.3
info:
  title: APB Buques (Ship Master Data) API
  description: |
    Maestro de referencia de buques — descubierto en la auditoría de cobertura
    2026-07-13 (`coverage-audit.md`). Grounded en
    `sostrat/src/org/apb/sostrat/dataaccess/dto/Vaixell.java` (tabla `VAIXELL`,
    68 atributos Java declarados localmente, confirmados uno a uno contra el
    código fuente real el 2026-07-14 — ver `app-dossiers/dossier-17-buques.md
    §5/§9`). Consumido como referencia por al menos 13 módulos (Escalas,
    Cruceros, MMPP, Manifiestos, Aduanas/Terminales, Aguada, MARPOL, Depotsis,
    PPS, Mano de Estiba, Suministro Eléctrico, SCPP/Inspección, Liquidación) —
    fan-out muy superior a los 3 consumidores (Escalas/Cruceros/MMPP)
    planificados originalmente en `jira-backlog.md` EPIC-16.

    **Corrección 2026-07-14**: la v1.0.0 de este contrato solo cubría 14/68
    campos reales y tipaba `bandera` incorrectamente como `string` libre — es
    `Integer` (FK a catálogo de banderas), con `banderaISO` como campo de
    enriquecimiento aparte. Esta versión amplía el esquema a los 68 campos,
    corrige el tipo de `bandera`, corrige `lng` (era `boolean`, el campo real
    es `String`, semántica S/N no confirmada por Javadoc), añade el endpoint
    de restauración y los sub-recursos de certificados/ISPS/servicio regular
    de aduana ausentes.
  version: "1.1.0"
