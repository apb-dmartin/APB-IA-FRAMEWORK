paths:
  /vessels:
    get:
      operationId: listVessels
      summary: Listar buques
      tags: [vessels]
      parameters:
        - name: mmsi
          in: query
          schema: { type: string }
        - name: callsign
          in: query
          schema: { type: string }
        - name: numlloyds
          in: query
          schema: { type: string }
          description: "Grounded: Vaixell.numlloyds — IMO/número Lloyd's"
        - name: cursor
          in: query
          schema: { type: string }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Página de buques
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Vessel" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
    post:
      operationId: createVessel
      summary: Dar de alta un buque (caso de uso legacy "01.01.13 Mantenimiento de Buques")
      description: |
        Grounded: CN_Vaixell.crear gestiona certificados en dos colecciones
        paralelas (certificados/certificadosAltres) como una operación
        compuesta Vaixell + VaixellCertificat[] + VaixellCertificats[], no
        una escritura simple de una sola tabla.
      tags: [vessels]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VesselCreate" }
      responses:
        "201":
          description: Buque creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vessel" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /vessels/{idvaixell}:
    parameters:
      - name: idvaixell
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getVessel
      summary: Consultar la ficha técnica de un buque
      tags: [vessels]
      responses:
        "200":
          description: Buque encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vessel" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateVessel
      summary: Modificar ficha técnica del buque
      description: |
        Grounded: dispara el evento BuqueActualizado; Cruceros solo revalida si
        cambian nomvaixell/maxmaniga/maxcalat/maxeslora (evidencia:
        arrModifCruEscOOPP en el código legacy — arrModifCruEscOOPP solo
        contiene maxcalat/maxeslora, arrModificacionCE contiene además
        nomvaixell/maxmaniga; no diferenciado en un único evento en esta
        versión, ver dossier §7/§12 para el diseño de propagación pendiente
        de los 10 consumidores adicionales sin mecanismo de invalidación
        equivalente).
      tags: [vessels]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VesselCreate" }
      responses:
        "200":
          description: Buque actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vessel" }
        "404": { $ref: "#/components/responses/NotFound" }
  /vessels/{idvaixell}/deactivate:
    parameters:
      - name: idvaixell
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: deactivateVessel
      summary: "Dar de baja el buque (grounded: darDeBaja)"
      tags: [vessels]
      responses:
        "200":
          description: Buque dado de baja
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vessel" }
        "404": { $ref: "#/components/responses/NotFound" }
  /vessels/{idvaixell}/restore:
    parameters:
      - name: idvaixell
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: restoreVessel
      summary: Restaurar un buque dado de baja
      description: |
        Añadido 2026-07-14 — CN_Vaixell.restaurar() es un método real, distinto
        de darDeBaja/eliminar (borrado físico); jira-backlog.md:356 ya lo cita
        como historia de usuario, pero no existía endpoint en la v1.0.0 de
        este contrato. Ver dossier-17-buques.md §9.
      tags: [vessels]
      responses:
        "200":
          description: Buque restaurado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vessel" }
        "404": { $ref: "#/components/responses/NotFound" }
  /vessels/{idvaixell}/certificates:
    parameters:
      - name: idvaixell
