        "404": { $ref: "#/components/responses/NotFound" }
# GAP PENDIENTE (2026-07-14, dossier-17 §6/§9/§12): el circuito de
# importación masiva Lloyd's Register (CargaBDLloydsAction,
# CN_Vaixell.actualizarDeLloyds, conciliación de discrepancias vía
# obtenerDiscrepancias/actualizarDiscrepancias) NO tiene ningún endpoint aquí.
# Es un circuito de fichero + reconciliación manual, no una API en vivo — el
# dossier recomienda explícitamente publicar primero la API de referencia
# (este contrato) y migrar el circuito Lloyd's en una segunda ola, modelado
# como ACL de ingesta por fichero, preservando la regla de negocio real
# "actualizarDeLloyds solo inserta, nunca actualiza registros existentes"
# (Javadoc literal de CN_Vaixell.java:156-157). No inventar aquí un endpoint
# sin esa decisión de diseño explícita.
