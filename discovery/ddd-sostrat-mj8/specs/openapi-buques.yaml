      summary: Listar certificados "principales" del buque (VaixellCertificat)
      description: |
        Añadido 2026-07-14 — api-surface-by-phase.md:260 ya asumía este
        endpoint ("evidencia VaixellCertificat.java/VaixellCertificats.java")
        pero no existía en la v1.0.0 de este contrato. Grounded en
        VaixellCertificat.java — DTO sin tabla propia confirmada, PK compuesta
        (VaixellCertificatPK: idvaixell+datinivigencia), gestionado por
        CN_Vaixell.crear/modificar (parámetro certificados).
      tags: [certificates]
      responses:
        "200":
          description: Página de certificados principales
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/VesselCertificate" }
        "404": { $ref: "#/components/responses/NotFound" }
  /vessels/{idvaixell}/other-certificates:
    parameters:
      - name: idvaixell
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listVesselOtherCertificates
      summary: Listar certificados "de otro tipo" del buque (VaixellCertificats, tabla VAIXELL_CERTIFICATS)
      description: |
        Añadido 2026-07-14. Grounded en VaixellCertificats.java (tabla
        VAIXELL_CERTIFICATS, PK idcertificat), gestionado por
        CN_Vaixell.crear/modificar (parámetro certificadosAltres). Distinto de
        /certificates (VaixellCertificat, sin tabla propia) — dos colecciones
        paralelas reales en el código, no una duplicación de diseño.
      tags: [certificates]
      responses:
        "200":
          description: Página de certificados "de otro tipo"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/VesselOtherCertificate" }
        "404": { $ref: "#/components/responses/NotFound" }
  /vessels/{idvaixell}/isps:
    parameters:
