info:
  title: APB Datos Maestros de Equipamiento API
  description: |
    Datos maestros compartidos de equipamiento (contenedores y otros equipos de
    transporte de mercancías). Fuente única de verdad para el dato de identidad
    de un contenedor, consumida por Manifiestos, MMPP, PIF, Depotsis,
    Aduanas/Control de Contenedores y Facturación y Liquidaciones — sustituye el
    acceso directo a la tabla `EQUIPAMENT` que hoy hacen 6 dominios distintos.

    Grounded en `sostrat/src/org/apb/sostrat/dataaccess/dto/mmpp/maestros/Equipament.java`
    (tabla `EQUIPAMENT`, PK `idequipament`) — maestro deliberadamente delgado, 6
    campos únicamente. No incluye peso, estado ni situación aduanera: esos
    atributos son propios de cada bounded context consumidor (ver
    `../events-catalog.md` §13 para la justificación de diseño).
  version: "1.0.0"
  contact:
    name: Arquitectura APB
    email: arquitectura@portdebarcelona.cat
  x-ai-generated: true
  x-ai-skill: "apb-arch-api-contract-v1.0"
