components:
  securitySchemes:
    entraId:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/portdebarcelona.cat/oauth2/v2.0/token
          scopes:
            equipamiento.read: Lectura de equipamiento
            equipamiento.write: Escritura de equipamiento
  schemas:
    ContainerEquipment:
      type: object
      required: [idequipament, refequipament, matriculaiso, idtipequipament]
      properties:
        idequipament:
          type: integer
          format: int64
          description: "Grounded: Equipament.idequipament (PK, columna IDEQUIPAMENT)"
        refequipament:
          type: string
          maxLength: 50
          description: "Grounded: Equipament.refequipament (columna REFEQUIPAMENT) — referencia de negocio"
        matriculaiso:
          type: string
          maxLength: 11
          pattern: "^[A-Z]{4}[0-9]{7}$"
          description: "Grounded: Equipament.matriculaiso (columna MATRICULAISO) — matrícula ISO 6346. Patrón añadido por este spec (norma ISO 6346), no confirmado literalmente en el código — validar con negocio antes de aplicar como restricción dura."
        idtipequipament:
          type: integer
          description: "Grounded: Equipament.idtipequipament (columna IDTIPEQUIPAMENT) — FK a TipusEquipament"
        propietari:
          type: string
          nullable: true
          description: "Grounded: Equipament.propietari (columna PROPIETARI)"
        idoridade:
          type: string
          nullable: true
          description: "Grounded: Equipament.idoridade (columna IDORIDADE)"
      example:
        idequipament: 145820
        refequipament: "REF-000145820"
        matriculaiso: "MSCU1234567"
        idtipequipament: 2
        propietari: "MSC MEDITERRANEAN SHIPPING COMPANY"
        idoridade: "ES"
    ContainerEquipmentCreate:
      type: object
      required: [refequipament, matriculaiso, idtipequipament]
      properties:
        refequipament: { type: string, maxLength: 50 }
        matriculaiso: { type: string, maxLength: 11 }
        idtipequipament: { type: integer }
        propietari: { type: string, nullable: true }
        idoridade: { type: string, nullable: true }
    ContainerEquipmentUpdate:
      type: object
      properties:
        refequipament: { type: string, maxLength: 50 }
        matriculaiso: { type: string, maxLength: 11 }
        idtipequipament: { type: integer }
        propietari: { type: string, nullable: true }
        idoridade: { type: string, nullable: true }
    Pagination:
      type: object
      properties:
        nextCursor: { type: string, nullable: true }
        hasMore: { type: boolean }
    ProblemDetails:
      type: object
      description: RFC 7807 Problem Details
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
  responses:
    BadRequest:
      description: Solicitud inválida
      content:
