      description: "Grounded: ErrorProcConc constantes TIPERR_*"
    ContainerMovement:
      type: object
      description: "Corregido 2026-07-14: redefinido sobre TrasllatContenidor.java (tabla TRASLLAT_CONTENIDOR, PK IDTRASLLATS) — el esquema anterior modelaba MovimientoContenedor.java, DTO huérfano sin uso real. Ver dossier-13-aduanas-contenedores.md §2/§5/§9."
      required: [idtrasllats, matricula]
