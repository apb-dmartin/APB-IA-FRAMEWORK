      responses:
        "200": { description: Página de situación aduanera, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/CustomsStatus" } }, pagination: { $ref: "#/components/schemas/Pagination" } } } } } }
