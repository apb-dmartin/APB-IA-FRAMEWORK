    huérfano sin DAO ni uso real confirmado en el checkout, ver
    `app-dossiers/dossier-13-aduanas-contenedores.md §2/§14`), vista
    `dataaccess/views/dto/aduanas/VTcMAduanaContenidor.java`, y (conciliación)
    `dataaccess/dto/terminales/ProtermCont.java` (tabla PROTERM_CONT, PK
    idregistre) + `ErrorProcConc.java` (errores/warnings de conciliación).
    Requiere consolidación interna previa de `service/aduanas` +
    `service/terminales` (ver jira-backlog.md EPIC-11) — hoy repartido entre
    ambos paquetes en el monolito.
