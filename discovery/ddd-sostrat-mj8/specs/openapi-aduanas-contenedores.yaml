info:
  title: APB Aduanas / Control de Contenedores API
  description: |
    Control de tránsito y traslado de contenedores en régimen aduanero, y
    conciliación de datos de terminales. Grounded en
    `sostratWSCXF/.../dataaccess/dto/TrasllatContenidor.java` (tabla
