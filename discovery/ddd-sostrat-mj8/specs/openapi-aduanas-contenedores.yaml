      parameters:
        - { name: numescala, in: query, schema: { type: integer } }
        - { name: refequipament, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: Página de datos de terminal conciliados, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/TerminalReconciliationData" } }, pagination: { $ref: "#/components/schemas/Pagination" } } } } } }
