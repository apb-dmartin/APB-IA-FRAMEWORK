        idusuari: { type: string, nullable: true, description: "Grounded: TrasllatContenidor.idusuari" }
        matricula: { type: string, description: "Grounded: TrasllatContenidor.matricula (matrícula del vehículo/contenedor según el flujo)" }
        origen: { type: integer, format: int64, nullable: true, description: "Grounded: TrasllatContenidor.origen (código)" }
