      responses:
        "200": { description: Página de errores/warnings de conciliación, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/ReconciliationError" } }, pagination: { $ref: "#/components/schemas/Pagination" } } } } } }
