        idequipament: { type: string, nullable: true, description: "Grounded: TrasllatContenidor.idequipament — FK a EQUIPAMENT (bc-datos-maestros-equipamiento-v1)" }
        refequipament: { type: string, nullable: true, description: "Grounded: TrasllatContenidor.refequipament (matrícula/referencia real del equipo)" }
        idmanifest: { type: string, nullable: true, description: "Grounded: TrasllatContenidor.idmanifest — FK a MANIFEST (bc-manifiestos-v1)" }
        idpartida: { type: string, nullable: true, description: "Grounded: TrasllatContenidor.idpartida — FK a PARTIDA (bc-manifiestos-v1)" }
        numpartida: { type: string, nullable: true, description: "Grounded: TrasllatContenidor.numpartida" }
        estat: { type: string, nullable: true, description: "Grounded: TrasllatContenidor.estat — catálogo de valores no confirmado en el checkout auditado" }
        nif: { type: string, nullable: true, description: "Grounded: TrasllatContenidor.nif (NIF del conductor)" }
        idtransaccio: { type: string, nullable: true, description: "Grounded: TrasllatContenidor.idtransaccio (correlación con el SOAP externo contenedoressecure)" }
