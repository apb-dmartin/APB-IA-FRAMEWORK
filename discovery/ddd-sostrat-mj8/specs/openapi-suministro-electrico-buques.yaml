servers:
  - url: https://apim.portdebarcelona.cat/shore-power-readings/v1
    description: APIM (producción)
security:
  - entraId: []
tags:
  - name: shore-power-readings
    description: Lecturas de suministro eléctrico a buques
paths:
  /shore-power-readings:
    get:
      operationId: listShorePowerReadings
      summary: Listar lecturas de suministro eléctrico
      tags: [shore-power-readings]
      parameters:
        - name: numescala
          in: query
          schema: { type: integer }
        - name: anyescala
          in: query
          schema: { type: integer }
        - name: idarmador
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Página de lecturas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ShorePowerReading" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
    post:
      operationId: createShorePowerReading
      summary: Registrar una lectura de consumo eléctrico
      tags: [shore-power-readings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShorePowerReadingCreate" }
      responses:
        "201":
          description: Lectura registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShorePowerReading" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /shore-power-readings/{idlectura}:
    parameters:
      - name: idlectura
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getShorePowerReading
      summary: Consultar una lectura
      tags: [shore-power-readings]
      responses:
        "200":
          description: Lectura encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShorePowerReading" }
        "404": { $ref: "#/components/responses/NotFound" }
  /shore-power-readings/{idlectura}/sessions:
    parameters:
      - name: idlectura
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listShorePowerSessions
      summary: Listar las sesiones de conexión/desconexión de una lectura (SeConsum)
      description: |
        Añadido 2026-07-14 — Grounded: SeConsum.java (PK compuesta
        idlectura+idconsumo), una fila por sesión recibida del sistema externo
        de telemetría. Ausente de la v1.0.0 de este contrato.
      tags: [shore-power-readings]
      responses:
        "200":
          description: Página de sesiones
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ShorePowerSession" }
  /shore-power-concessionaires:
    get:
      operationId: listShorePowerConcessionaires
      summary: Listar concesionarios de puntos de suministro (SeConcesionari)
      description: "Añadido 2026-07-14 — Grounded: SeConcesionari.java (catálogo, tabla real). Ausente de la v1.0.0."
      tags: [shore-power-readings]
      responses:
        "200":
          description: Página de concesionarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ShorePowerConcessionaire" }
  /shore-power-sync-log:
    get:
      operationId: listShorePowerSyncLog
      summary: Consultar el histórico de errores/eventos de sincronización (SeLogSincronizacion)
      description: |
        Añadido 2026-07-14 — Grounded: SeLogSincronizacion (6 campos), poblada
        por crearErrorSync() en cada paso relevante del proceso batch (inicio,
        sin datos, error de conexión, fin). Ausente de la v1.0.0.
      tags: [shore-power-readings]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Página del log de sincronización
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ShorePowerSyncLogEntry" }
  /shore-power-readings/{idlectura}/settle:
    parameters:
      - name: idlectura
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: settleShorePowerReading
      summary: "Liquidar la lectura (grounded: liquidacionMasiva)"
      description: |
        Actualizado 2026-07-14 (dossier-21 §9): cierre parcial del gap — los
        5 NOMBRES del enum de estado sí están confirmados (CREADA → PDTE_LIQ
        → LIQUIDADA → FACTURADA, con ANULADA alcanzable desde varios puntos,
        campo idestat). Sigue pendiente confirmar los códigos de cadena
        literales reales (constantes SE_ELECT_ESTADOLECT_*) antes de fijar el
        enum en el contrato definitivo.
      tags: [shore-power-readings]
      responses:
        "200":
          description: Lectura liquidada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShorePowerReading" }
        "404": { $ref: "#/components/responses/NotFound" }
  /shore-power-readings/{idlectura}/unsettle:
    parameters:
      - name: idlectura
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: unsettleShorePowerReading
      summary: "Desliquidar la lectura (grounded: desliquidar)"
      tags: [shore-power-readings]
      responses:
        "200":
          description: Lectura desliquidada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShorePowerReading" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    entraId:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/portdebarcelona.cat/oauth2/v2.0/token
          scopes:
            shore-power-readings.read: Lectura
            shore-power-readings.write: Escritura
  schemas:
    ShorePowerReading:
      type: object
      required: [idlectura, anyescala, numescala]
      properties:
        idlectura: { type: integer, format: int64, description: "Grounded: SeLectura (vista V_TC_LECTURA_ELECTRICITAT)" }
        anyescala: { type: integer, description: "Grounded: SeLectura.anyescala" }
        numescala: { type: integer, description: "Grounded: SeLectura.numescala" }
        idconsignatario: { type: string, nullable: true, description: "Grounded: SeLectura.idconsignatario" }
        idarmador: { type: string, nullable: true, description: "Grounded: SeLectura.idarmador" }
        idestat: { type: string, nullable: true, description: "Añadido 2026-07-14 — Grounded: SeLectura.idestat (String). Máquina de estados de 5 nombres confirmados (CREADA → PDTE_LIQ → LIQUIDADA → FACTURADA, con ANULADA alcanzable desde varios puntos) — los códigos de cadena literales (constantes SE_ELECT_ESTADOLECT_*) NO están confirmados en este checkout; enum no fijado en este contrato hasta esa confirmación (dossier-21 §3/§14)" }
        navinternacional: { type: string, nullable: true, description: "Corregido 2026-07-14 — Grounded: SeLectura.navinternacional (String, indicador S/N; la v1.0.0 lo tipaba erróneamente como boolean)" }
        tiempoconexion: { type: number, format: double, nullable: true, description: "Grounded: SeLectura.tiempoconexion" }
        tiempoatraque: { type: number, format: double, nullable: true, description: "Grounded: SeLectura.tiempoatraque" }
        lecturainici: { type: number, format: double, nullable: true, description: "Grounded: SeLectura.lecturainici" }
        lecturafi: { type: number, format: double, nullable: true, description: "Grounded: SeLectura.lecturafi" }
        consumototal: { type: number, format: double, nullable: true, description: "Grounded: SeLectura.consumototal (kWh)" }
        idtarifa: { type: string, nullable: true, description: "Grounded: SeLectura.idtarifa" }
        imptotal: { type: number, format: double, nullable: true, description: "Grounded: SeLectura.imptotal" }
        impfinaltotal: { type: number, format: double, nullable: true, description: "Grounded: SeLectura.impfinaltotal" }
      example:
        idlectura: 771034
        anyescala: 2026
        numescala: 8821
        idarmador: "ARM-0091"
        idestat: "LIQUIDADA"
        navinternacional: "N"
        tiempoconexion: 18.5
        tiempoatraque: 20.0
        lecturainici: 1042300.0
        lecturafi: 1044890.0
        consumototal: 2590.0
        idtarifa: "T-SP-01"
        imptotal: 512.30
        impfinaltotal: 619.88
    ShorePowerReadingCreate:
      type: object
      required: [anyescala, numescala]
      properties:
        anyescala: { type: integer }
        numescala: { type: integer }
        idconsignatario: { type: string }
        idarmador: { type: string }
        lecturainici: { type: number, format: double }
        lecturafi: { type: number, format: double }
    ShorePowerSession:
      type: object
      description: "Añadido 2026-07-14 — Grounded: SeConsum.java, una fila por sesión de conexión/desconexión recibida del sistema externo de telemetría"
      required: [idlectura, idconsumo]
      properties:
        idlectura: { type: integer, format: int64, description: "FK a SeLectura, parte 1 de la PK compuesta" }
        idconsumo: { type: integer, format: int64, description: "Parte 2 de la PK compuesta" }
        idfield: { type: string, nullable: true, description: "Identificador único de la sesión en el sistema externo, usado para detectar duplicados en re-sincronizaciones" }
        vaicodimo: { type: string, nullable: true, description: "Dato de buque denormalizado del payload externo (ShipImo) — no resuelto contra el maestro Vaixell en esta entidad" }
        vainom: { type: string, nullable: true, description: "Denormalizado del payload externo (ShipName)" }
        conexion: { type: string, format: date-time, nullable: true }
        desconexion: { type: string, format: date-time, nullable: true }
        duracionhoras: { type: number, format: double, nullable: true }
        consumo: { type: number, format: double, nullable: true, description: "Consumo del intervalo (LoadEnergy del WS externo)" }
        lecturainicial: { type: number, format: double, nullable: true }
        lecturafinal: { type: number, format: double, nullable: true }
        terminal: { type: string, nullable: true, description: "Nombre del sistema origen (SystemName del WS, ejemplo real: 'BEST')" }
        puntosuministro: { type: string, nullable: true }
    ShorePowerConcessionaire:
      type: object
      description: "Añadido 2026-07-14 — Grounded: SeConcesionari.java (catálogo, tabla real)"
      required: [idconcesionari]
      properties:
        idconcesionari: { type: string }
        dsssystemname: { type: string, nullable: true, description: "Semántica no confirmada más allá de 'nombre de sistema del concesionario' (dossier-21 §5/§14)" }
    ShorePowerSyncLogEntry:
      type: object
      description: "Añadido 2026-07-14 — Grounded: SeLogSincronizacion, poblada por crearErrorSync() en cada paso relevante del batch"
      required: [idlog]
      properties:
        idlog: { type: integer, format: int64 }
        datelog: { type: string, format: date-time, nullable: true }
        datesync: { type: string, format: date-time, nullable: true }
        idfield: { type: string, nullable: true, description: "Referencia a la sesión externa que originó el log" }
        error: { type: string, nullable: true, description: "Texto de error ya traducido" }
    Pagination:
      type: object
      properties:
        nextCursor: { type: string, nullable: true }
        hasMore: { type: boolean }
    ProblemDetails:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    NotFound:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
