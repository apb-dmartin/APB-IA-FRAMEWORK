openapi: 3.0.3
info:
  title: APB Suministro Eléctrico a Buques (Shore Power) API
  description: |
    Lecturas, consumo y liquidación del suministro eléctrico a buques atracados
    (cold-ironing/Shore Power) — descubierto en la auditoría de cobertura
    2026-07-13, corrige `bc-aguada-v1.md` (afirmaba incorrectamente que esta
    funcionalidad no existía). Grounded en
    `sostrat/src/org/apb/sostrat/dataaccess/dto/suministres/electricitat/SeLectura.java`
    (vista `V_TC_LECTURA_ELECTRICITAT`, ticket FACTSTD-878).

    **Corrección 2026-07-14** (`dossier-21-suministro-electrico-buques.md
    §4/§9`): añadido `idestat` (ausente en la v1.0.0), corregido el tipo de
    `navinternacional` (era `boolean`, el campo real es `String` indicador
    S/N), y añadidos recursos para `SeConsum` (sesiones individuales de
    conexión/desconexión), `SeConcesionari` y el histórico
    `SeLogSincronizacion` — ausentes de la v1.0.0 pese a ser entidades reales
    con DAO transaccional confirmado. También se documenta explícitamente que
    la única vía real de creación de lecturas es automática vía el batch de
    sincronización (`SeLecturasElectricidadTasklet`), no un alta manual — el
    endpoint `POST /shore-power-readings` de la v1.0.0 no está grounded en
    ningún flujo de alta manual real.
  version: "1.1.0"
  contact:
