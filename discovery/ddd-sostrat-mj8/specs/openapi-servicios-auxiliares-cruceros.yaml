paths:
  /cruise-buses:
    get:
      operationId: listCruiseBuses
      summary: Listar buses de traslado por día
      tags: [cruise-buses]
      parameters:
        - name: dia
          in: query
          schema: { type: string, format: date }
          description: "Corregido 2026-07-14 (antes numescala/anyescala, inexistentes) — Grounded: CreuerBus.dia. Es un agregado por día natural, no por escala."
        - name: cursor
          in: query
          schema: { type: string }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Página de buses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CruiseBus" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
    post:
      operationId: createCruiseBus
      summary: Registrar un bus de traslado para un día
      tags: [cruise-buses]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CruiseBusCreate" }
      responses:
        "201":
          description: Bus registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CruiseBus" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /cruise-buses/{idcrebus}/auxiliary:
    parameters:
      - name: idcrebus
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getCruiseBusAuxiliary
      summary: Consultar la asignación de proveedor/tarifa del bus (CreuerAuxiliarBus)
      description: |
        Añadido 2026-07-14 — Grounded: CreuerAuxiliarBus.java (tabla
        CREUER_AUXILIAR_BUS, PK idcrebus). Concentra la lógica de negocio real
        (asignación automática de proveedor vía
        CN_CruceroAuxiliarBus.asignarAuxiliarAutomaticamente, notificación por
        email en alta/baja) — ausente de la v1.0.0 de este contrato.
      tags: [cruise-buses]
      responses:
        "200":
          description: Asignación encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CruiseBusAuxiliary" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setCruiseBusAuxiliary
      summary: Asignar proveedor/tarifa/horario auxiliar al bus
      tags: [cruise-buses]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CruiseBusAuxiliaryCreate" }
      responses:
        "200":
          description: Asignación registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CruiseBusAuxiliary" }
        "404": { $ref: "#/components/responses/NotFound" }
  /cruise-security:
    get:
      operationId: listCruiseSecurityServices
      summary: Listar servicios de vigilancia por día
      tags: [cruise-security]
      parameters:
        - name: data
          in: query
          schema: { type: string, format: date }
          description: "Corregido 2026-07-14 — Grounded: CreuerVigilancia.data. Mismo patrón 'por día' que CreuerBus, tampoco tiene numescala/anyescala."
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Página de servicios de vigilancia
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CruiseSecurityService" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
    post:
      operationId: createCruiseSecurityService
      summary: Registrar un servicio de vigilancia para un día
      tags: [cruise-security]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CruiseSecurityServiceCreate" }
      responses:
        "201":
          description: Servicio de vigilancia registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CruiseSecurityService" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /cruise-security/{idcrevigilancia}/assignments:
    parameters:
      - name: idcrevigilancia
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listCruiseSecurityAssignments
      summary: Listar las asignaciones de proveedor por punto de vigilancia (CreuerVigilanciaServei)
      description: |
        Añadido 2026-07-14 — Grounded: CreuerVigilanciaServei.java (PK
        idcrevigilancia+idpuntvigilancia). Ausente de la v1.0.0.
      tags: [cruise-security]
      responses:
        "200":
          description: Página de asignaciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CruiseSecurityAssignment" }
  /cruise-security-points:
    get:
      operationId: listCruiseSecurityPoints
      summary: Listar el catálogo maestro de puntos de vigilancia
      description: |
        Corregido 2026-07-14 — Grounded: CreuerVigilanciaPunt.java (tabla
        CREUER_VIGILANCIA_PUNT). Es dato maestro reutilizable, **sin columna
        de escala ni de día** — no ligado a una escala concreta.
      tags: [cruise-security-points]
      parameters:
        - name: idsubport
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Página de puntos de vigilancia
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CruiseSecurityPoint" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
    post:
      operationId: createCruiseSecurityPoint
      summary: Dar de alta un punto de vigilancia en el catálogo maestro
      tags: [cruise-security-points]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CruiseSecurityPointCreate" }
      responses:
        "201":
          description: Punto de vigilancia registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CruiseSecurityPoint" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /cruise-tariffs:
    get:
      operationId: listCruiseTariffs
      summary: Listar tarifas de servicios auxiliares
      description: |
        Añadido 2026-07-14 — Grounded: CreuerServeiTarifa.java (PK
        idprestador+idtarifa, tabla de enlace/catálogo sin más campos
        propios). Ausente de la v1.0.0. **Nota de evidencia**: el precio
        real (precioFijo/precioHoraNormal/precioHoraExtra, usados por
        ComprobarFacturasAction/CreuerBusExcel) no se ha localizado en este
        DTO — pendiente de rastrear su origen exacto (dossier-18 §14).
      tags: [cruise-tariffs]
      responses:
        "200":
          description: Página de tarifas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CruiseTariff" }
components:
  securitySchemes:
    entraId:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/portdebarcelona.cat/oauth2/v2.0/token
          scopes:
            cruise-auxiliary-services.read: Lectura
            cruise-auxiliary-services.write: Escritura
  schemas:
    CruiseBus:
      type: object
      description: "Corregido 2026-07-14 — Grounded: CreuerBus.java (tabla CREUER_BUS, PK idcrebus). NO tiene numescala/anyescala/ocupacio como columnas propias (corrección de la v1.0.0)."
      required: [idcrebus, dia]
      properties:
        idcrebus: { type: integer, format: int64, description: "Grounded: CreuerBus.idcrebus (PK)" }
        dia: { type: string, format: date, description: "Corregido 2026-07-14 (antes numescala/anyescala) — Grounded: CreuerBus.dia" }
        festiu: { type: string, nullable: true, description: "Grounded: CreuerBus.festiu (flag, String)" }
        horenvsolicitud: { type: string, format: date-time, nullable: true, description: "Grounded: CreuerBus.horenvsolicitud" }
        observacions: { type: string, nullable: true }
        obsinternes: { type: string, nullable: true }
        maxsubindex: { type: integer, nullable: true, description: "Grounded: CreuerBus.maxsubindex — control de subíndice máximo del servicio" }
        detalls:
          type: array
          description: "Corregido 2026-07-14 (antes campo ocupacio, inexistente) — Grounded: CreuerBus.creuerBusDetall (1:N), tabla CREUER_BUS_DETALL. quantitat es el campo real de ocupación."
          items: { $ref: "#/components/schemas/CruiseBusDetail" }
      example:
        idcrebus: 5501
        dia: "2026-07-20"
        festiu: "N"
        detalls:
          - subindex: 1
            quantitat: 42
            idprestador: "PREST-04"
    CruiseBusDetail:
      type: object
      description: "Añadido 2026-07-14 — Grounded: CreuerBusDetall.java (PK idcrebus+subindex)"
      required: [subindex]
      properties:
        subindex: { type: integer }
        quantitat: { type: integer, description: "Campo real de 'ocupación' — no existe un campo llamado ocupacio en el DTO" }
        horainici: { type: integer, nullable: true }
        horafin: { type: integer, nullable: true }
        durada: { type: integer, nullable: true }
        idprestador: { type: string, nullable: true }
        idtarifa: { type: string, nullable: true }
    CruiseBusCreate:
      type: object
      description: "Corregido 2026-07-14 — mismo grounding que CruiseBus"
      required: [dia]
      properties:
        dia: { type: string, format: date }
        festiu: { type: string }
        horenvsolicitud: { type: string, format: date-time }
        observacions: { type: string }
    CruiseBusAuxiliary:
      type: object
      description: "Añadido 2026-07-14 — Grounded: CreuerAuxiliarBus.java (tabla CREUER_AUXILIAR_BUS, PK idcrebus)"
      required: [idcrebus]
      properties:
        idcrebus: { type: integer, format: int64 }
        idprestador: { type: string, nullable: true }
        idtarifa: { type: string, nullable: true }
        horainici: { type: integer, nullable: true }
        horafin: { type: integer, nullable: true }
        durada: { type: integer, nullable: true }
        quantitat: { type: integer, nullable: true }
        cobrador: { type: integer, nullable: true }
    CruiseBusAuxiliaryCreate:
      type: object
      properties:
        idprestador: { type: string }
        idtarifa: { type: string }
        horainici: { type: integer }
        horafin: { type: integer }
    CruiseSecurityService:
      type: object
      description: "Corregido 2026-07-14 — Grounded: CreuerVigilancia.java (tabla CREUER_VIGILANCIA, PK idcrevigilancia). NO tiene numescala/anyescala (corrección de la v1.0.0)."
      required: [idcrevigilancia, data]
      properties:
        idcrevigilancia: { type: integer, format: int64 }
        data: { type: string, format: date, description: "Corregido 2026-07-14 (antes numescala/anyescala)" }
        festiu: { type: string, nullable: true }
        horenvsolicitud: { type: string, format: date-time, nullable: true }
        observacions: { type: string, nullable: true }
    CruiseSecurityServiceCreate:
      type: object
      required: [data]
      properties:
        data: { type: string, format: date }
        festiu: { type: string }
        horenvsolicitud: { type: string, format: date-time }
    CruiseSecurityAssignment:
      type: object
      description: "Añadido 2026-07-14 — Grounded: CreuerVigilanciaServei.java (PK idcrevigilancia+idpuntvigilancia)"
      required: [idcrevigilancia, idpuntvigilancia]
      properties:
        idcrevigilancia: { type: integer, format: int64 }
        idpuntvigilancia: { type: integer }
        idprestador: { type: string, nullable: true }
        idtarifa: { type: string, nullable: true }
        horainici: { type: integer, nullable: true }
        horafin: { type: integer, nullable: true }
        durada: { type: integer, nullable: true }
        quantitat: { type: integer, nullable: true }
        auxvigilant: { type: integer, nullable: true }
    CruiseSecurityPoint:
      type: object
      description: "Corregido 2026-07-14 — Grounded: CreuerVigilanciaPunt.java (tabla CREUER_VIGILANCIA_PUNT, PK idpuntvigilancia). Catálogo maestro, sin numescala/anyescala/moll como columnas propias (corrección de la v1.0.0)."
      required: [idpuntvigilancia]
      properties:
        idpuntvigilancia: { type: integer, description: "Grounded: CreuerVigilanciaPunt.idpuntvigilancia (PK, Integer)" }
        nompuntvigilancia: { type: string, nullable: true }
        idsubport: { type: string, nullable: true }
        idzonaport: { type: string, nullable: true }
        datbaixa: { type: string, format: date-time, nullable: true, description: "Baja lógica" }
        alineaciones:
          type: array
          description: "Corregido 2026-07-14 (antes campo moll, inexistente) — Grounded: CreuerVigilanciaPuntMoll[] (PK idpuntvigilancia+idsubport+idporta), enlaza el punto con una puerta/muelle física"
          items: { $ref: "#/components/schemas/CruiseSecurityPointDock" }
      example:
        idpuntvigilancia: 4
        nompuntvigilancia: "Punto Adossat Nord"
        idsubport: "B"
        alineaciones:
          - idsubport: "B"
            idporta: 12
    CruiseSecurityPointDock:
      type: object
      description: "Añadido 2026-07-14 — Grounded: CreuerVigilanciaPuntMoll.java"
      properties:
        idsubport: { type: string }
        idporta: { type: integer, format: int64 }
    CruiseSecurityPointCreate:
      type: object
      description: "Corregido 2026-07-14 — mismo grounding que CruiseSecurityPoint"
      required: [nompuntvigilancia]
      properties:
        nompuntvigilancia: { type: string }
        idsubport: { type: string }
        idzonaport: { type: string }
    CruiseTariff:
      type: object
      description: "Añadido 2026-07-14 — Grounded: CreuerServeiTarifa.java (PK idprestador+idtarifa, tabla de enlace/catálogo sin más campos propios ni campo de precio confirmado en el DTO)"
      required: [idprestador, idtarifa]
      properties:
        idprestador: { type: string }
        idtarifa: { type: string }
    Pagination:
      type: object
      properties:
        nextCursor: { type: string, nullable: true }
        hasMore: { type: boolean }
    ProblemDetails:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    NotFound:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
