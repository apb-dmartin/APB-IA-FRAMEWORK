openapi: 3.0.3
info:
  title: APB Servicios Auxiliares de Cruceros API
  description: |
    Buses de traslado y vigilancia en muelle para escalas de crucero —
    descubierto en la auditoría de cobertura 2026-07-13. Grounded en
    `sostrat/src/org/apb/sostrat/dataaccess/dto/serviciosAuxiliares/CreuerBus.java`
    (tabla `CREUER_BUS`) y `CreuerVigilanciaPunt.java` (tabla `CREUER_VIGILANCIA_PUNT`).

    **Corrección 2026-07-14** (`dossier-18-servicios-auxiliares-cruceros.md
    §5/§9/§14`, corrección de modelo de datos de mayor impacto de este
    dossier): la v1.0.0 modelaba `CruiseBus`/`CruiseSecurityPoint` con
    `numescala`/`anyescala`/`ocupacio`/`moll` — **ninguno de estos 4 campos
    existe en los DTOs reales**. `CreuerBus`/`CreuerVigilancia` son
    agregados **por día natural** (`dia`/`data`), no por escala; el campo de
    ocupación real es `CreuerBusDetall.quantitat`; `CreuerVigilanciaPunt` es
    catálogo maestro sin columna de escala en absoluto (el campo más
    cercano a "moll" es la relación `CreuerVigilanciaPuntMoll`, vía
    `idsubport`+`idporta`). Contrato reconstruido sobre los 8 DTOs reales,
    incluyendo `CreuerAuxiliarBus`/`CreuerVigilanciaServei` (la lógica de
    negocio real: asignación de proveedor/tarifa, notificación), ausentes
    de la v1.0.0 pese a concentrar la mayor parte de la lógica del BC.
