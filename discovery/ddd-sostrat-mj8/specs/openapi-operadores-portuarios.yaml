info:
  title: APB Operadores Portuarios / Terceros API
  description: |
    Maestro de negocio de terceros (consignatarios, armadores, agentes de
    aduanas) — descubierto en la auditoría de cobertura 2026-07-13. Grounded en
    `sostrat/src/org/apb/sostrat/dataaccess/dto/Usuari.java` (tabla `USUARI`).

    **NO es la capa de autenticación/login** — esa capa (Operador/Rol) vive
    fuera de este repositorio y se cubre por dom-transversal-arq-v1/EntraID.

    ⚠️ `parent_domain` tentativo — ver `bc-operadores-portuarios-v1.md`. Esta
    spec es provisional hasta confirmar el dominio con Arquitectura APB.

    **Corrección 2026-07-14** (`dossier-23-operadores-portuarios.md
    §2/§9/§14`): `eseffnetwork` corregido de `boolean` a `string` (valores
    reales `"S"`/`"N"`, asignados literalmente en
    `CN_Usuari_Impl.java:978-980` — la discrepancia se repetía en 3
    documentos distintos, incluido este). `comptefaceenlace` (nombre
    inexistente en el DTO) corregido a `compteface` (`Integer`). Añadido el
    sub-recurso `CompteBancari` (cuentas bancarias/mandato SEPA) y endpoints
    de baja/restauración — ausentes de la v0.1.0 pese a ser operaciones
    reales (`dardeBaixa`/`restaurar`).
