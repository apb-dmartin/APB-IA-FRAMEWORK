              schema: { $ref: "#/components/schemas/PortOperator" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    entraId:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/portdebarcelona.cat/oauth2/v2.0/token
          scopes:
            port-operators.read: Lectura
            port-operators.write: Escritura
  schemas:
    PortOperator:
      type: object
      required: [idusuari, nif]
      properties:
        idusuari: { type: string, description: "Grounded: Usuari.idusuari (PK, columna IDUSUARI)" }
        tippersona: { type: string, nullable: true, description: "Grounded: Usuari.tippersona (columna TIPPERSONA)" }
        nom: { type: string, nullable: true, description: "Grounded: Usuari.nom (columna NOM)" }
        cognom1: { type: string, nullable: true, description: "Grounded: Usuari.cognom1 (columna COGNOM1)" }
        nif: { type: string, description: "Grounded: Usuari.nif (columna NIF)" }
        eori: { type: string, nullable: true, description: "Grounded: Usuari.eori (columna EORI, código de operador económico aduanero UE)" }
        cnae: { type: string, nullable: true, description: "Grounded: Usuari.cnae (columna CNAE)" }
        codiagent: { type: string, nullable: true, description: "Grounded: Usuari.codiagent (columna CODIAGENT, código de agente de aduanas)" }
        comptefaceenlace: { type: string, nullable: true, description: "Grounded: Usuari.comptefaceenlace (columna COMPTEFACE, cuenta FACe facturación electrónica)" }
        eseffnetwork: { type: boolean, nullable: true, description: "Grounded: Usuari.eseffnetwork (columna ESEFFNETWORK) — adhesión al programa Efficiency Network, ver EPIC-22 (bloqueada)" }
        llistanegra: { type: boolean, nullable: true, description: "Grounded: Usuari.llistanegra (columna LLISTA_NEGRA)" }
      example:
        idusuari: "U0044213"
        tippersona: "J"
        nom: "Naviera Ejemplo S.A."
        nif: "A12345678"
        eori: "ES12345678900001"
        cnae: "5222"
        codiagent: "AG-0421"
        eseffnetwork: true
        llistanegra: false
    PortOperatorCreate:
      type: object
      required: [nif]
      properties:
        tippersona: { type: string }
        nom: { type: string }
        cognom1: { type: string }
        nif: { type: string }
        eori: { type: string }
        cnae: { type: string }
        codiagent: { type: string }
    Pagination:
      type: object
      properties:
        nextCursor: { type: string, nullable: true }
        hasMore: { type: boolean }
    ProblemDetails:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    NotFound:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
