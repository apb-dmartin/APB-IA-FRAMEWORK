channels:
  evt.sostrat.mmpp:
    subscribe:
      operationId: onMmppEvent
      message: { oneOf: [ { $ref: "#/components/messages/AutorizacionMMPPConcedida" }, { $ref: "#/components/messages/NotificacionMMPPEnviada" } ] }
