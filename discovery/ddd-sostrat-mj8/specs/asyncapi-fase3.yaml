components:
  messages:
    AutorizacionMMPPConcedida:
      name: AutorizacionMMPPConcedida
      contentType: application/json
      payload: { $ref: "#/components/schemas/CloudEventEnvelope", x-data-schema: "#/components/schemas/AutorizacionMmppData" }
    NotificacionMMPPEnviada:
      name: NotificacionMMPPEnviada
