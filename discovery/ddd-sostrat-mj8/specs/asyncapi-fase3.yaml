        - scenario: "Fallo en el circuito EDI de envío a autoridades"
          handling: "Reintento con backoff; tras agotar reintentos, DLQ + alerta a operaciones (plazo regulatorio en juego)."
    OperacionPifRegistrada:
      name: OperacionPifRegistrada
