  version: "1.0.0"
  description: |
    Contratos de evento para los 4 servicios de Fase 3. Ver `../events-catalog.md`
    §9-10, §8, §12 para la evidencia de código de cada campo.
  contact: { name: Arquitectura APB, email: arquitectura@portdebarcelona.cat }
