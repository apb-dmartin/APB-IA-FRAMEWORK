  evt.sostrat.pif:
    subscribe:
      operationId: onPifEvent
      message: { $ref: "#/components/messages/OperacionPifRegistrada" }
    bindings: { amqp: { deadLetterExchange: "evt.sostrat.pif.dlq" } }
  evt.sostrat.manifiestos:
    subscribe:
      operationId: onManifiestosEvent
      message: { oneOf: [ { $ref: "#/components/messages/ManifiestoRegistrado" }, { $ref: "#/components/messages/ManifiestoCircuitoProcesado" }, { $ref: "#/components/messages/PartidaActualizada" } ] }
    bindings: { amqp: { deadLetterExchange: "evt.sostrat.manifiestos.dlq" } }
  evt.sostrat.aduanas-contenedores:
    subscribe:
      operationId: onAduanasEvent
      message: { oneOf: [ { $ref: "#/components/messages/TrasladoContenedorActualizado" }, { $ref: "#/components/messages/DatosTerminalConciliados" }, { $ref: "#/components/messages/ErrorConciliacionDetectado" } ] }
