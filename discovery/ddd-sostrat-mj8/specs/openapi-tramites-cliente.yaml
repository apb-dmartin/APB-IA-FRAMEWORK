        idtramitorigen: { type: integer, format: int64, nullable: true, description: "Añadido 2026-07-14 — Grounded: TramitClient.idtramitorigen, auto-referencia para la cadena 'trámite respuesta'" }
        datacreacio: { type: string, format: date-time, nullable: true, description: "Corregido 2026-07-14 (antes datcreacio)" }
