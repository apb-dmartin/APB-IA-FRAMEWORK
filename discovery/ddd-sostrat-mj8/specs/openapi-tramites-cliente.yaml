    `idtipustramit`→`idtiptramit`, `idestat`→`idestattramit`,
    `datcreacio`→`datacreacio`, `datlectura`→`datalectura`. Corregidos todos
    contra el DTO real (`TramitClient.java`, `TramitClientTipus.java`,
    `TramitClientEstat.java`).
